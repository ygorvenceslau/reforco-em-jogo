<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar - Reforço em Jogo</title><link rel="stylesheet" href="css/style.css"></head><body>
<main>
  <h1>Entrar</h1>
  <form id="form">
    <label for="email">E-mail da professora</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <p id="erro" class="erro" role="alert"></p>
    <button class="btn" type="submit">Entrar</button>
  </form>
  <p class="muted">Ainda não tem acesso? Fale com a equipe do projeto.</p>
  <a class="btn outline" href="index.html">Voltar</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/login.js"></script></body></html>
