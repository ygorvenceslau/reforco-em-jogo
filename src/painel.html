<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Painel - Reforço em Jogo</title><link rel="stylesheet" href="css/style.css"></head><body>
<main>
  <h1>Painel</h1>
  <p class="muted">Logada como <span id="quem">...</span></p>

  <div class="card">
    <h2>Criar sessão</h2>
    <label for="habilidade">Habilidade</label>
    <select id="habilidade"><option>Carregando...</option></select>
    <button class="btn" id="gerar" type="button">Gerar link da sessão</button>
    <p id="erro" class="erro" role="alert"></p>

    <div id="resultado" hidden>
      <p class="muted">Sessão pronta. Código:</p>
      <div id="codigo" class="codigo"></div>
      <p id="link" class="muted" style="word-break:break-all"></p>
      <div class="acoes">
        <button class="btn mini" id="copiar" type="button">Copiar link</button>
        <a class="btn mini outline" id="whatsapp" target="_blank" rel="noopener">Compartilhar no WhatsApp</a>
        <a class="btn mini outline" id="ver">Ver relatório</a>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Minhas sessões</h2>
    <div id="lista"><p class="muted">Carregando...</p></div>
  </div>

  <button class="btn outline" id="sair" type="button">Sair</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/painel.js"></script></body></html>
