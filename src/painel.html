<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Painel - Reforço em Jogo</title><link rel="stylesheet" href="css/style.css"></head><body>
<main>
  <h1>Painel</h1>
  <p class="muted">Logada como <span id="quem">...</span></p>
  <div class="card">
    <h2>Criar sessão</h2>
    <label for="habilidade">Habilidade</label>
    <select id="habilidade"><option>Carregando...</option></select>
    <button class="btn" id="gerar" type="button">Gerar link da sessão</button>
    <p id="erro" class="erro" role="alert"></p>
    <div id="resultado" hidden>
      <p class="muted">Código para os alunos:</p>
      <p id="codigo" class="codigo"></p>
      <p class="muted">Link direto:</p>
      <p><a id="link" class="quebra" target="_blank" rel="noopener"></a></p>
      <button class="btn outline" id="copiar" type="button">Copiar link</button>
      <a class="btn outline" id="ver-relatorio" style="margin-top:10px">Ver relatório</a>
    </div>
  </div>
  <div class="card">
    <h2>Minhas sessões</h2>
    <div id="sessoes"><p class="muted">Carregando...</p></div>
  </div>
  <button class="btn outline" id="sair" type="button">Sair</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/painel.js"></script></body></html>
