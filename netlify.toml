[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Os arquivos de assets/ têm um código no nome que muda a cada versão,
# então o celular pode guardá-los por um ano: a próxima visita abre quase na hora.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Endereços da versão antiga do site (links já compartilhados continuam funcionando).
[[redirects]]
  from = "/entrar.html"
  to = "/jogar"
  status = 301

[[redirects]]
  from = "/login.html"
  to = "/mestre/entrar"
  status = 301

[[redirects]]
  from = "/painel.html"
  to = "/mestre"
  status = 301

[[redirects]]
  from = "/diagnostico.html"
  to = "/diagnostico"
  status = 301

# Todas as outras rotas são do React (single page app).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
